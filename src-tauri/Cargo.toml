[package]
name = "dice-chaos-compass"
version = "1.0.0-beta.1"
description = "Dice Chaos Compass — Free, open-source high-resolution TTRPG battlemap & world atlas cartography studio"
authors = ["dicechaos"]
homepage = "https://dicechaos.com"
repository = "https://github.com/dicechaos/DiceChaosCompass"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "dice_chaos_compass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
blake3 = "1.5"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
thiserror = "2"
parking_lot = "0.12"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
